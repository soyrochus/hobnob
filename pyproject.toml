[project]
name = "hobnob"
version = "0.1.0"
description = "Playground for Hob features"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jmespath>=1.0.1",
    "langchain>=0.3.27",
    "langchain-openai>=0.3.28",
    "langgraph>=0.6.2",
    "python-dotenv>=1.1.1",
    "tenacity>=8.2.3",
    "psycopg[binary,pool]>=3.2.3",
    "orjson>=3.10.0",
    "jsonschema>=4.23.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "ruff>=0.12.7",
    "types-jmespath>=1.0.2",
]

[project.scripts]
hobnob = "hobnob.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["hobnob*"]
exclude = ["tests*", "examples*", "sql*"]
